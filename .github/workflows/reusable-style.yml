name: Style
on:
  workflow_call:

jobs:
  style:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Format check
        run: pnpm run format:check
